# ═══════════════════════════════════════════════════════════════
# ARES Agent — canonical configuration (configs/ares.yaml)
#
# Usage:
#   cfg, _ := sdk.LoadConfigFile("configs/ares.yaml")
#   opts, _ := cfg.ToOptions()
#   rt := sdk.MustNew(opts...)
#
# All fields are optional — omit or set to zero to use component defaults.
# Override config path via the ARES_YAML environment variable.
# ═══════════════════════════════════════════════════════════════

# ── HTTP server ──────────────────────────────────────────────
server:
  # host: actual HTTP bind address (default "localhost").
  # The introspect read API (/api/v1/introspect/*) is unauthenticated, so
  # serve binds loopback by default. To accept connections from other hosts
  # (e.g. inside docker), set host: 0.0.0.0 AND enable security.auth_enabled.
  # host: localhost
  # port: 8080

# ── LLM provider ─────────────────────────────────────────────
llm:
  # provider: openai | ollama | anthropic | openrouter
  provider: ollama
  # model: model name (e.g. gpt-4o, llama3.2, claude-3-5-sonnet)
  model: llama3.2
  # api_key: API key (may also be set via OPENAI_API_KEY / ANTHROPIC_API_KEY env vars)
  # api_key: sk-...
  # base_url: custom API endpoint (OpenAI-compatible proxies / self-hosted)
  # base_url: https://api.openai.com/v1
  # temperature: generation temperature [0-2], default 0.7
  # temperature: 0.7
  # max_tokens: max output tokens, default 4096
  # max_tokens: 4096

  # ── Local override ──────────────────────────────────────────
  # The gate-3 preserved-case regression scorer (LLMArenaScorer) is driven by a
  # real LLM. Put your credentials in configs/ares.local.yaml (git-ignored),
  # NOT here, to avoid committing secrets. Example for the sensenova
  # OpenAI-compatible endpoint used in development:
  #
  #   llm:
  #     provider: openai
  #     model: "deepseek-v4-flash"                  # exact API model ID (hyphenated)
  #     api_key: "<your-api-key>"
  #     base_url: "https://token.sensenova.cn/v1"   # root; client appends /chat/completions

# ── Memory / Distillation / RAG ──────────────────────────────
memory:
  # enabled: enable the memory subsystem (session history + distillation + RAG)
  enabled: false
  # max_history: max conversation history messages to keep, 0 = component default
  # max_history: 50
  # max_sessions: max number of sessions, 0 = component default
  # max_sessions: 100
  # enable_distillation: when true, raw conversation is distilled into structured
  #   Experience records after each dialogue round
  # distillation_threshold: fire distillation every N rounds. 3 = every 3rd
  #   conversation round. 0 = fire on every event (legacy ungated behaviour)
  distillation_threshold: 3
  # enable_rag: when true, past experiences and AKG knowledge are retrieved
  #   and injected into the LLM prompt during agent.BuildContext
  enable_rag: false
  # rag_top_k: max number of retrieved snippets to inject. Must be >= 1 when
  #   enable_rag is true
  rag_top_k: 5
  # rag_min_score: minimum similarity score for a snippet to be included [0-1]
  rag_min_score: 0.4

# ── Knowledge Graph (AKG / AKF Knowledge Fabric) ────────────
knowledge:
  # chunk_size: document chunk size. When > 0 the AKG knowledge engine is
  #   automatically started and wired into the RAG pipeline
  # chunk_size: 512
  # chunk_overlap: chunk overlap size
  # chunk_overlap: 64
  # top_k: number of top results returned on retrieval
  # top_k: 5
  # min_score: minimum similarity score for retrieval results
  # min_score: 0.4

  # ── AKG 0.2.9 quality gate ──────────────────────────────────
  # Controls the fact lifecycle: candidates whose computed Confidence clears
  # min_final_score are promoted to active and become retrievable by the
  # StoreProvider. min_final_score replaces the old hardcoded 0.4 threshold.
  quality:
    min_extraction: 0.5
    min_consistency: 0.5
    min_final_score: 0.55
    max_facts_per_ingest: 50
    enable_dedup: true
    dedup_threshold: 0.85

  # ── AKG 0.2.9 embedding service ────────────────────────────
  # Arms both the write side (DistillBridge vectorizing distilled facts) and
  # the read side (StoreProvider embedding retrieval queries) with vector
  # recall. Empty model falls back to the embedding service configured under
  # the top-level `embedding:` section.
  embedding:
    model: "intfloat/e5-large-v2"
    base_url: "http://localhost:8000"

# ── Evolution system ─────────────────────────────────────────
evolution:
  # enabled: when true, the strategy evolution engine (GA) optimises agent
  #   behaviour (tool selection, search depth, scheduler) over time
  enabled: false

  # min_interval: heartbeat period of the evolution ticker. Each tick goes
  #   through scheduler.Tick, which re-applies the same shouldEvolve +
  #   guardrail throttling as event-triggered evolution.
  # min_interval: 5m

  # The blocks below configure the strategy control plane. Every knob is
  # optional: an absent field (or 0) keeps the built-in default shown after
  # the "default:" marker, so the whole section can be omitted safely.

  # lifecycle: the JUDGE stage — how runtime evidence is aggregated into a
  #   single [0,1] fitness, and how often rollback is re-evaluated.
  # lifecycle:
  #   fitness_window: 50              # runtime samples kept per source
  #   min_samples_before_judge: 10    # below this, no promote/rollback verdict
  #   cold_start_score: 0.5           # fallback fitness when no evidence exists
  #   watch_interval: 30s             # rollback watch-loop period
  #   min_active_duration: 90s        # how long a promoted strategy must stay
  #                                   # active before another candidate may
  #                                   # replace it. Default: 3 × watch_interval.
  #                                   # Throttles promote churn so the rollback
  #                                   # window can accumulate evidence between
  #                                   # promotions.
  #   # JUDGE weights. Set none to use the defaults below; set any and the
  #   # unset ones become 0 (partial specs are used verbatim, never blended
  #   # with defaults, so the operator gets exactly the mix they wrote).
  #   outcome_weight: 0.40
  #   dimension_eval_weight: 0.25
  #   workflow_weight: 0.15
  #   scheduler_weight: 0.15
  #   recovery_weight: 0.05

  # rollback: degradation detection for the active strategy. The threshold is
  #   on the same [0,1] scale as the fitness window mean. `enabled` is
  #   tri-state (defaults true): the rollback net is part of the promote path's
  #   safety contract, so omitting it arms the net. An explicit `enabled: false`
  #   disarms rollback AND re-arms the G2 shadow gate fail-closed (see shadow
  #   below) — with neither pre- nor post-deployment verification, refusing
  #   promotion is the only correct behavior.
  # rollback:
  #   enabled: true
  #   degradation_threshold: 0.15
  #   window_size: 5
  #   min_samples: 3

  # shadow: the G2 verify gate. Its registration is decided by the wiring layer
  #   (shadowGateMode), not hardcoded here, so the gate is an honest check
  #   rather than a rubber stamp. The decision table:
  #     - independent scorer wired    → G2 is registered (REAL verification).
  #     - no scorer + rollback armed  → G2 is NOT registered (honest absence);
  #       candidates promote directly and degradation triggers automatic
  #       rollback — promotion is reversible, so the pre-deployment gate is
  #       dispensed with instead of being a permanent wall.
  #     - no scorer + rollback disarmed → G2 stays registered and FAIL-CLOSED
  #       (the safety floor: with neither verification, refuse promotion).
  #   In the default config (DreamCycle disabled + LLM scoring off) the second
  #   row applies: `evolution.enabled: true` MEANS "the GA keeps shipping new
  #   strategies", and automatic rollback is reachable because the open promote
  #   path establishes a `previous`. Enable `evolution.llm_scoring` (or wire a
  #   scorer) to flip to the first row — real comparison-driven promotion — and
  #   tune min_samples/min_win_rate via YAML.
  #   CAVEAT: the sampler scores the SAME candidate/active pair min_samples
  #   times, so the comparisons are only independent under a non-deterministic
  #   (LLM) scorer. With a deterministic scorer min_samples counts repetitions,
  #   not independent evidence.
  # shadow:
  #   min_samples: 20
  #   min_win_rate: 0.55

  # shadow_execution: real-execution A/B for candidate strategies (closure
  #   plan Step 4 / N-1). When enabled, each judged candidate AND the active
  #   strategy are executed on buffered copies of recent real tasks inside an
  #   isolated runner whose side effects are denied at the interface level
  #   (no production memory writes, tool calls intercepted), and the G2 gate
  #   judges the paired result — candidate-specific evidence, unlike the
  #   replay-only fallback (which reads each strategy's own history and is
  #   NOT candidate-specific for a never-executed candidate).
  #   Default: disabled. sample_size = how many recent tasks each judgment
  #   executes in isolation (both arms per task); default 3.
  # shadow_execution:
  #   enabled: false
  #   sample_size: 3

  # channel_feedback: the two perception channels evolution was previously blind
  #   to (closure plan Step Y.2/Y.3). An agent can only perceive the outside
  #   world through three channels — its own task outcomes, the tools it called,
  #   and the collaboration receipts other agents sent back. Task outcomes
  #   already feed the loop (RuntimeObserver); these two knobs add the other
  #   two, each as its OWN evidence source ("collaboration" / "tool_call") so
  #   they never contaminate the strategy/shadow verdicts.
  #   Without them, evolution cannot learn "stop asking that agent" or "stop
  #   calling that tool" — the reason N-11 forbade claiming the loop covers
  #   collaboration and tool selection.
  #
  #   `*_enabled` controls RECORDING; `*_weight` controls whether the channel
  #   COUNTS in the fitness aggregate. They are separate so an operator can
  #   inspect the evidence in the audit trail before letting it move a verdict.
  #   A weight without its enabled flag is ignored (nothing would be recorded to
  #   weigh); a weight of 0 leaves the channel inert — it adds neither score nor
  #   sample count. Default: both channels off, matching pre-Step-Y behavior.
  # channel_feedback:
  #   collab_enabled: false
  #   collab_weight: 0.0              # e.g. 0.15 once the evidence looks sane
  #   tool_enabled: false
  #   tool_weight: 0.0                # e.g. 0.15

  # tool_projection: the production trigger for the ToolStep projection (Y1
  #   §12-1). It is NOT a duplicate of channel_feedback.tool_enabled above:
  #   that writes ONE evidence record per tool call as it happens, while this
  #   worker periodically projects the tool-call EVENT LOG into
  #   per-(tool#arg_shape) success rates carrying `tool_step_id` — the key the
  #   tool_step-scoped fitness read filters on. Without this worker that
  #   dimension has no live producer and stays an on-demand audit read only.
  #   Both may be enabled: they answer "did this call work" versus "does this
  #   WAY of calling this tool work".
  #
  #   Requires a wired event store — with none, the projection is permanently
  #   empty, so the worker refuses to start (logged) instead of writing empty
  #   graphs on a timer.
  #
  #   Each tick reads only events since the previous successful tick, so
  #   records are not re-emitted for calls already projected. Startup begins
  #   the window at "now": projecting the whole history in one burst would
  #   judge the CURRENT strategy on behavior it never produced.
  #
  #   min_samples drops steps with too few calls — a single call yields a
  #   success rate of exactly 0 or 1, which carries no statistical signal.
  #   Default: disabled, matching pre-Y1 behavior.
  # tool_projection:
  #   enabled: false
  #   interval: 10m                   # projection period
  #   min_samples: 3                  # skip steps with fewer calls

  # gates: the remaining verify-gate thresholds.
  # gates:
  #   eval_min_score: 0.7             # minimum G3 eval-suite score
  #   eval_strict: false              # true = G3 fails closed when eval infra is missing (E3)
  #   # require_manual_approval holds every candidate in SHADOW until an
  #   # operator calls POST /api/evolution/approve.
  #   require_manual_approval: false

  # tool_pool: the tool-whitelist configurations the GA mutator may emit as
  #   Params["tools"] (each entry is a comma-separated registered tool list).
  #   Empty disables pool-based tool mutation; guided mutation may still produce
  #   tool choices from experience hints. Values MUST name REGISTERED tools —
  #   a whitelist naming unknown tools intersects to zero at runtime and the
  #   executors fall back to the FULL set (see guardrails.known_tools below).
  # tool_pool:
  #   - "web_search,calculator"
  #   - "web_search,calculator,code_runner,file_tools"

  # guardrails: the tool-set selection guards. All opt-in — absent defaults are
  #   the pre-existing permissive behavior (no bound, no vocabulary check).
  # guardrails:
  #   max_tools_enabled: 4             # reject whitelists enabling >4 tools
  #   require_any_tool: false          # true = reject zero-tool strategies
  #   known_tools:                     # registered vocabulary; unknown names rejected
  #     - "web_search"
  #     - "calculator"
  #     - "code_runner"

# ── Agents ───────────────────────────────────────────────────
# C1 flat peer structure (DEFAULT): a flat set of equal capability agents
# spawned into the Agent Fabric and scheduled by the kernel scheduler. There
# is no leader. Each entry is one agent; capabilities is the full declared
# capability set (any matching task is schedulable to it); priority mirrors
# OS-thread scheduling priority (0 = normal).
# The legacy agents.sub list is still accepted as a fallback (each sub's
# single `type` becomes its only capability) so pre-C1 configs keep working;
# the legacy `agents.leader` structure was removed in v0.4.0.
agents:
  peers:
    - id: coder
      capabilities: ["code", "refactor"]
      # priority: 1.0
    - id: reviewer
      capabilities: ["review", "audit"]
    - id: researcher
      capabilities: ["research"]

# ── Kernel (no-leader scheduler) ─────────────────────────────
# The kernel scheduler drives every execution via
# Schedule → Acquire → RunQuantum → finalize. The knobs below only affect the
# loop CLOCK (the evolution round boundary); they never gate the task flow, so
# an exhausted round budget still leaves the scheduler draining tasks.
kernel:
  # loop_round_quanta: how many scheduler quanta constitute one loop round.
  #   0 or unset → 1 (every quantum closes a round). Raise it to amortise
  #   round-end work (checkpoint flush / memory advise / evolution record)
  #   over more quanta. Negative is a config error.
  # loop_round_quanta: 1
  #
  # loop_max_iterations: cap on how many rounds the clock advances.
  #   0 or unset → unlimited. When the budget is exhausted the round clock
  #   stops and logs once; task scheduling is unaffected. Negative is a
  #   config error.
  # loop_max_iterations: 0
  #
  # dag_execution: L2 session-graph execution gate (M4, default CLOSED).
  #   Absent or enabled:false → legacy ReAct behavior, byte-identical to
  #   today. To canary the L2 path: set enabled:true on a subset of peers,
  #   compare EventToolCallCompleted success rate + planner ForcedAnswers
  #   against the ReAct baseline, then cut over. Rollback = set false +
  #   restart (S1). Do NOT enable in production until the B2 numbers pass.
  # dag_execution:
  #   enabled: false
  #   max_plan_depth: 10              # growth-depth guard (0 = default 10)
  #   reaper_grace: 30s               # terminal-task reaper grace (0 = 30s)

# ── Tool system ──────────────────────────────────────────────
tools:
  # builtin: load built-in tools (calculator, web_search, file, etc.)
  builtin: true
  # mcp: list of MCP server commands to connect via stdio. Each command is
  #   started as a subprocess and its tools are automatically registered
  # mcp:
  #   - npx @modelcontextprotocol/server-filesystem ./data
  #   - uvx mcp-server-git

# ── Reflection (agent self-assessment) ───────────────────────
reflection:
  # enabled: when true, the agent reflects on its own outputs
  enabled: false

# ── Database (knowledge store backend) ───────────────────────
database:
  # host: PostgreSQL host address
  # host: localhost
  # port: 5432
  # user: postgres
  # password: REPLACE_WITH_YOUR_PASSWORD
  # database: ares
  # ssl_mode: disable | require | verify-full
  # ssl_mode: disable

# ── Embedding service (required for distillation + RAG) ──────
embedding:
  # service_url: embedding service endpoint (OpenAI-compatible API)
  # service_url: http://localhost:8080/v1/embeddings
  # model: embedding model name
  # model: text-embedding-ada-002

# ═══════════════════════════════════════════════════════════════
# Minimal config (starts a basic agent):
#
#   llm:
#     provider: ollama
#     model: llama3.2
#
# ═══════════════════════════════════════════════════════════════
# Full-featured config (distillation + RAG + AKG + evolution):
#
#   llm:
#     provider: openai
#     model: gpt-4o
#     api_key: ${OPENAI_API_KEY}
#
#   memory:
#     enabled: true
#     enable_distillation: true
#     distillation_threshold: 3
#     enable_rag: true
#     rag_top_k: 5
#     rag_min_score: 0.4
#
#   knowledge:
#     chunk_size: 512
#     chunk_overlap: 64
#     top_k: 5
#     min_score: 0.4
#     quality:
#       min_extraction: 0.5
#       min_consistency: 0.5
#       min_final_score: 0.55
#       max_facts_per_ingest: 50
#       enable_dedup: true
#       dedup_threshold: 0.85
#     embedding:
#       model: "intfloat/e5-large-v2"
#       base_url: "http://localhost:8000"
#
#   evolution:
#     enabled: true
#
#   tools:
#     builtin: true
#
#   database:
#     host: localhost
#     port: 5432
#     user: postgres
#     password: REPLACE_WITH_YOUR_PASSWORD
#     database: ares
#
#   embedding:
#     service_url: http://localhost:8080/v1/embeddings
#     model: text-embedding-ada-002
